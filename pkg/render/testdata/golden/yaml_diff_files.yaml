    modified:
        /mod/changed:
            path: /mod/changed
            sha256: ""
            size: 0
            behaviors:
                - description: binds a port
                  riskscore: 1
                  risklevel: LOW
                  ruleurl: https://r/bind
                  id: net/bind
                - description: runs a shell - quickly
                  matchstrings:
                    - /bin/sh
                    - evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-evidence-
                  riskscore: 3
                  risklevel: HIGH
                  ruleurl: https://r/shell
                  ruleauthor: Dee
                  diffadded: true
                  id: exec/shell
                - description: reads files
                  matchstrings:
                    - fopen
                  riskscore: 1
                  risklevel: LOW
                  ruleurl: https://r/read
                  diffremoved: true
                  id: fs/read
                - description: uses AES
                  riskscore: 2
                  risklevel: MEDIUM
                  ruleurl: https://r/aes
                  diffadded: true
                  diffremoved: true
